<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>晶胞互动模型系列</title>
  <meta name="description" content="可旋转、可换色的晶胞互动模型系列，适合公众号科普和课堂演示。">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --ink: #132126;
      --muted: #62727a;
      --line: #c9d2d6;
      --panel: rgba(255, 255, 255, .88);
      --panel-strong: rgba(255, 255, 255, .96);
      --accent: #1f7a8c;
      --accent-2: #bf6f24;
      --shadow: 0 18px 54px rgba(26, 45, 52, .16);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: radial-gradient(circle at 30% 10%, #ffffff 0, #edf3f5 42%, #dde7eb 100%);
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      min-height: 100vh;
    }

    .stage {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .brand {
      position: absolute;
      left: 24px;
      top: 22px;
      max-width: min(520px, calc(100% - 48px));
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .brand p {
      margin: 10px 0 0;
      max-width: 36em;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .hint {
      position: absolute;
      left: 24px;
      bottom: 22px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }

    .hint span {
      padding: 7px 10px;
      background: rgba(255, 255, 255, .7);
      border: 1px solid rgba(201, 210, 214, .7);
      border-radius: 7px;
    }

    .model-tabs {
      position: absolute;
      left: 24px;
      top: 122px;
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .model-tabs .btn {
      background: rgba(255, 255, 255, .78);
    }

    .model-tabs .btn[aria-pressed="true"] {
      border-color: #176a7a;
      background: var(--accent);
      color: #fff;
    }

    aside {
      min-height: 100vh;
      padding: 18px;
      border-left: 1px solid rgba(154, 172, 181, .42);
      background: linear-gradient(180deg, var(--panel-strong), var(--panel));
      box-shadow: var(--shadow);
      overflow-y: auto;
    }

    .panel {
      display: grid;
      gap: 18px;
    }

    .section {
      padding-bottom: 17px;
      border-bottom: 1px solid rgba(154, 172, 181, .36);
    }

    .section:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
    }

    .selected {
      min-height: 58px;
      padding: 12px;
      background: #eef5f6;
      border: 1px solid #c7dadd;
      border-radius: 8px;
      line-height: 1.5;
      font-size: 14px;
    }

    .selected strong {
      font-weight: 500;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
    }

    button, input {
      font: inherit;
    }

    .swatch {
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid rgba(19, 33, 38, .2);
      border-radius: 8px;
      cursor: pointer;
    }

    .swatch:focus-visible, .btn:focus-visible, .toggle input:focus-visible {
      outline: 3px solid rgba(31, 122, 140, .28);
      outline-offset: 2px;
    }

    .custom-color {
      display: grid;
      grid-template-columns: 1fr 46px;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }

    .custom-color input {
      width: 46px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 2px;
      background: transparent;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .btn {
      min-height: 39px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
    }

    .btn.primary {
      border-color: #176a7a;
      background: var(--accent);
      color: #fff;
    }

    .toggles {
      display: grid;
      gap: 10px;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
    }

    .toggle input {
      width: 42px;
      height: 24px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .legend {
      display: grid;
      gap: 8px;
      font-size: 14px;
    }

    .legend-row {
      display: grid;
      grid-template-columns: 16px 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(19, 33, 38, .2);
    }

    .qr-note {
      padding: 12px;
      border-radius: 8px;
      background: #fff8ee;
      border: 1px solid #eed0a8;
      color: #5a3d1e;
      font-size: 13px;
      line-height: 1.55;
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .app {
        display: block;
      }
      .stage {
        height: 66vh;
        min-height: 440px;
      }
      aside {
        min-height: auto;
        border-left: 0;
        border-top: 1px solid rgba(154, 172, 181, .42);
        box-shadow: none;
      }
      .brand {
        left: 16px;
        top: 16px;
      }
      h1 {
        font-size: 25px;
      }
      .brand p {
        display: none;
      }
      .hint {
        left: 16px;
        right: 16px;
        bottom: 14px;
      }
    }

    @media (max-width: 430px) {
      .stage {
        min-height: 390px;
      }
      .hint span {
        padding: 6px 8px;
        font-size: 13px;
      }
      aside {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="stage" aria-label="晶胞三维模型">
      <div class="brand">
        <h1 id="modelTitle">晶胞互动模型系列</h1>
        <p id="modelDescription">拖动旋转，滚轮缩放，点击任意粒子换色。</p>
      </div>
      <div class="model-tabs" aria-label="选择晶胞模型">
        <button class="btn" type="button" id="modelDiamond" aria-pressed="false">金刚石</button>
        <button class="btn" type="button" id="modelFluorite" aria-pressed="false">氟化钙</button>
      </div>
      <div id="viewer"></div>
      <div class="hint">
        <span>拖动：旋转</span>
        <span>滚轮/双指：缩放</span>
        <span>点击球体：选中</span>
      </div>
    </section>

    <aside aria-label="模型控制">
      <div class="panel">
        <section class="section">
          <h2>当前选择</h2>
          <div id="selected" class="selected" aria-live="polite">
            <strong>未选中原子</strong><br>
            <span class="muted">点击任意球体后可单独换色。</span>
          </div>
        </section>

        <section class="section">
          <h2>给选中原子换色</h2>
          <div class="swatches" id="swatches" aria-label="颜色选择"></div>
          <label class="custom-color">
            <span class="muted">自定义颜色</span>
            <input id="customColor" type="color" value="#2f8da2" aria-label="自定义颜色">
          </label>
        </section>

        <section class="section">
          <h2>分组演示</h2>
          <div class="btn-grid" id="groupButtons"></div>
        </section>

        <section class="section">
          <h2>显示控制</h2>
          <div class="toggles">
            <label class="toggle">
              <span>自动旋转</span>
              <input id="autoRotate" type="checkbox">
            </label>
            <label class="toggle">
              <span>显示晶胞边框</span>
              <input id="showFrame" type="checkbox" checked>
            </label>
            <label class="toggle">
              <span>显示共价键</span>
              <input id="showBonds" type="checkbox" checked>
            </label>
          </div>
          <label class="custom-color">
            <span class="muted">棱和键颜色</span>
            <input id="stickColor" type="color" value="#9aa7ad" aria-label="棱和键颜色">
          </label>
        </section>

        <section class="section">
          <h2>结构标识</h2>
          <div class="legend" id="legend"></div>
        </section>

        <section class="section">
          <div class="qr-note">
            公众号正文里建议放模型预览图，再用“阅读原文”、二维码或菜单链接跳转到这个互动页。
          </div>
        </section>
      </div>
    </aside>
  </main>

  <script src="./vendor/three/three.min.js"></script>
  <script src="./vendor/three/controls/OrbitControls-legacy.js"></script>
  <script src="./app.js"></script>
</body>
</html>
